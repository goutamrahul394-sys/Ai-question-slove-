<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question AI - Smart Study Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        .app-header {
            background: #fff;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header h1 {
            font-size: 24px;
            color: #1d1d1f;
            font-weight: 600;
        }

        .app-header p {
            font-size: 14px;
            color: #6e6e73;
            margin-top: 4px;
        }

        .container {
            max-width: 680px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .subject-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .subject-selector::-webkit-scrollbar {
            display: none;
        }

        .subject-chip {
            padding: 10px 20px;
            border: 1.5px solid #d2d2d7;
            background: #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
            color: #1d1d1f;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .subject-chip:hover {
            border-color: #007aff;
            background: #f0f7ff;
        }

        .subject-chip.active {
            background: #007aff;
            color: #fff;
            border-color: #007aff;
        }

        .input-section {
            margin-top: 16px;
        }

        .input-label {
            font-size: 14px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 12px;
            display: block;
        }

        .question-input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #d2d2d7;
            border-radius: 12px;
            font-size: 15px;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .question-input:focus {
            outline: none;
            border-color: #007aff;
            box-shadow: 0 0 0 4px rgba(0,122,255,0.1);
        }

        .image-upload-area {
            border: 2px dashed #d2d2d7;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
        }

        .image-upload-area:hover {
            border-color: #007aff;
            background: #f0f7ff;
        }

        .image-upload-area.has-image {
            padding: 0;
            border: none;
            position: relative;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .upload-text {
            font-size: 15px;
            color: #1d1d1f;
            font-weight: 500;
        }

        .upload-hint {
            font-size: 13px;
            color: #6e6e73;
            margin-top: 4px;
        }

        #imageInput {
            display: none;
        }

        .preview-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
        }

        .preview-image {
            width: 100%;
            display: block;
            border-radius: 12px;
        }

        .remove-image {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
        }

        .action-btn:hover:not(:disabled) {
            background: #0051d5;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,122,255,0.4);
        }

        .action-btn:disabled {
            background: #d2d2d7;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 32px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #007aff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 15px;
            color: #6e6e73;
        }

        .result-card {
            display: none;
            animation: slideUp 0.3s ease;
        }

        .result-card.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .result-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .answer-content {
            font-size: 15px;
            line-height: 1.6;
            color: #1d1d1f;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .error-card {
            display: none;
            background: #fff1f0;
            border: 1.5px solid #ffccc7;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .error-card.show {
            display: block;
        }

        .error-content {
            display: flex;
            align-items: start;
            gap: 12px;
        }

        .error-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .error-text {
            font-size: 14px;
            color: #cf1322;
            line-height: 1.5;
        }

        @media (max-width: 640px) {
            .container {
                padding: 0 16px;
            }

            .card {
                padding: 20px;
            }

            .app-header {
                padding: 14px 16px;
            }

            .app-header h1 {
                font-size: 20px;
            }

            .subject-chip {
                font-size: 13px;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>📚 Question AI</h1>
        <p>Upload image or type your question to get instant answers</p>
    </div>

    <div class="container">
        <div class="card">
            <span class="input-label">Select Subject</span>
            <div class="subject-selector">
                <div class="subject-chip" data-subject="Hindi">हिंदी</div>
                <div class="subject-chip" data-subject="English">English</div>
                <div class="subject-chip" data-subject="Mathematics">Math</div>
                <div class="subject-chip" data-subject="Physics">Physics</div>
                <div class="subject-chip" data-subject="Chemistry">Chemistry</div>
                <div class="subject-chip" data-subject="Biology">Biology</div>
                <div class="subject-chip" data-subject="History">History</div>
                <div class="subject-chip" data-subject="Geography">Geography</div>
            </div>

            <div class="input-section">
                <label class="input-label">Your Question</label>
                <textarea class="question-input" id="questionInput" placeholder="Type your question here..."></textarea>
            </div>

            <div class="input-section">
                <label class="input-label">Or Upload Image</label>
                <div class="image-upload-area" id="uploadArea">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">Click to upload image</div>
                    <div class="upload-hint">Supports JPG, PNG (Max 4MB)</div>
                </div>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <button class="action-btn" id="submitBtn">Get Answer</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Analyzing your question...</div>
        </div>

        <div class="error-card" id="errorCard">
            <div class="error-content">
                <div class="error-icon">⚠️</div>
                <div class="error-text" id="errorText"></div>
            </div>
        </div>

        <div class="card result-card" id="resultCard">
            <div class="result-header">
                <span>✅</span>
                <h3>Answer</h3>
            </div>
            <div class="answer-content" id="answerContent"></div>
        </div>
    </div>

    <script>
        const API_KEY = 'AIzaSyAS2_JFIqwHc3tnbXvv4S0jbeexvXCk8wM';
        let selectedSubject = '';
        let uploadedImage = null;

        // Subject selection
        document.querySelectorAll('.subject-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.subject-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                selectedSubject = this.dataset.subject;
            });
        });

        // Image upload handling
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');

        uploadArea.addEventListener('click', () => {
            if (!uploadArea.classList.contains('has-image')) {
                imageInput.click();
            }
        });

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 4 * 1024 * 1024) {
                    showError('Image size should be less than 4MB');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImage = {
                        data: event.target.result.split(',')[1],
                        mimeType: file.type
                    };
                    displayImagePreview(event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        function displayImagePreview(src) {
            uploadArea.classList.add('has-image');
            uploadArea.innerHTML = `
                <div class="preview-container">
                    <img src="${src}" class="preview-image" alt="Uploaded">
                    <button class="remove-image" onclick="removeImage()">✕</button>
                </div>
            `;
        }

        window.removeImage = function() {
            uploadedImage = null;
            uploadArea.classList.remove('has-image');
            uploadArea.innerHTML = `
                <div class="upload-icon">📸</div>
                <div class="upload-text">Click to upload image</div>
                <div class="upload-hint">Supports JPG, PNG (Max 4MB)</div>
            `;
            imageInput.value = '';
        };

        // Submit handler
        document.getElementById('submitBtn').addEventListener('click', async function() {
            const question = document.getElementById('questionInput').value.trim();
            
            hideError();
            hideResult();

            // Validation
            if (!selectedSubject) {
                showError('Please select a subject');
                return;
            }

            if (!question && !uploadedImage) {
                showError('Please enter a question or upload an image');
                return;
            }

            // Show loading
            showLoading();
            this.disabled = true;

            try {
                const answer = await getAnswer(question, uploadedImage, selectedSubject);
                displayAnswer(answer);
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
                this.disabled = false;
            }
        });

        async function getAnswer(question, image, subject) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`;
            
            let prompt = `You are an expert ${subject} teacher. `;
            
            if (image && question) {
                prompt += `The student has shared an image and asked: "${question}". Please analyze the image and provide a detailed answer.`;
            } else if (image) {
                prompt += `Please analyze this image related to ${subject} and provide a detailed explanation of what you see, solving any problems or questions visible in the image.`;
            } else {
                prompt += `Please answer this question: ${question}`;
            }

            prompt += `\n\nProvide a clear, step-by-step solution with explanations.`;

            const parts = [{ text: prompt }];
            
            if (image) {
                parts.push({
                    inline_data: {
                        mime_type: image.mimeType,
                        data: image.data
                    }
                });
            }

            const requestBody = {
                contents: [{
                    parts: parts
                }],
                generationConfig: {
                    temperature: 0.4,
                    topK: 32,
                    topP: 0.95,
                    maxOutputTokens: 2048
                }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'Failed to get answer. Please try again.');
            }

            const data = await response.json();
            
            if (!data.candidates || !data.candidates[0]?.content?.parts?.[0]?.text) {
                throw new Error('Invalid response from API');
            }

            return data.candidates[0].content.parts[0].text;
        }

        function showLoading() {
            document.getElementById('loading').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }

        function showError(message) {
            const errorCard = document.getElementById('errorCard');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorCard.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorCard').classList.remove('show');
        }

        function displayAnswer(answer) {
            const resultCard = document.getElementById('resultCard');
            const answerContent = document.getElementById('answerContent');
            answerContent.textContent = answer;
            resultCard.classList.add('show');
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function hideResult() {
            document.getElementById('resultCard').classList.remove('show');
        }
    </script>
</body>
</html>
