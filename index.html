<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question AI - Smart Study Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        .app-header {
            background: #fff;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header h1 {
            font-size: 24px;
            color: #1d1d1f;
            font-weight: 600;
        }

        .app-header p {
            font-size: 14px;
            color: #6e6e73;
            margin-top: 4px;
        }

        .container {
            max-width: 680px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .subject-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .subject-selector::-webkit-scrollbar {
            display: none;
        }

        .subject-chip {
            padding: 10px 20px;
            border: 1.5px solid #d2d2d7;
            background: #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
            color: #1d1d1f;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .subject-chip:hover {
            border-color: #007aff;
            background: #f0f7ff;
        }

        .subject-chip.active {
            background: #007aff;
            color: #fff;
            border-color: #007aff;
        }

        .input-section {
            margin-top: 16px;
        }

        .input-label {
            font-size: 14px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 12px;
            display: block;
        }

        .question-input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #d2d2d7;
            border-radius: 12px;
            font-size: 15px;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .question-input:focus {
            outline: none;
            border-color: #007aff;
            box-shadow: 0 0 0 4px rgba(0,122,255,0.1);
        }

        .image-upload-area {
            border: 2px dashed #d2d2d7;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
        }

        .image-upload-area:hover {
            border-color: #007aff;
            background: #f0f7ff;
        }

        .image-upload-area.has-image {
            padding: 0;
            border: none;
            position: relative;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .upload-text {
            font-size: 15px;
            color: #1d1d1f;
            font-weight: 500;
        }

        .upload-hint {
            font-size: 13px;
            color: #6e6e73;
            margin-top: 4px;
        }

        #imageInput {
            display: none;
        }

        .preview-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
        }

        .preview-image {
            width: 100%;
            display: block;
            border-radius: 12px;
        }

        .remove-image {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
        }

        .action-btn:hover:not(:disabled) {
            background: #0051d5;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,122,255,0.4);
        }

        .action-btn:disabled {
            background: #d2d2d7;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 24px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #007aff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 15px;
            color: #6e6e73;
        }

        .result-card {
            display: none;
            animation: slideUp 0.2s ease;
        }

        .result-card.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .result-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .answer-content {
            font-size: 15px;
            line-height: 1.6;
            color: #1d1d1f;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .error-card {
            display: none;
            background: #fff1f0;
            border: 1.5px solid #ffccc7;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .error-card.show {
            display: block;
        }

        .error-content {
            display: flex;
            align-items: start;
            gap: 12px;
        }

        .error-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .error-text {
            font-size: 14px;
            color: #cf1322;
            line-height: 1.5;
        }

        @media (max-width: 640px) {
            .container {
                padding: 0 16px;
            }
            .card {
                padding: 20px;
            }
            .app-header {
                padding: 14px 16px;
            }
            .app-header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>📚 Question AI</h1>
        <p>Instant answers in seconds</p>
    </div>

    <div class="container">
        <div class="card">
            <span class="input-label">Select Subject</span>
            <div class="subject-selector">
                <div class="subject-chip active" data-subject="Mathematics">Math</div>
                <div class="subject-chip" data-subject="Hindi">हिंदी</div>
                <div class="subject-chip" data-subject="English">English</div>
                <div class="subject-chip" data-subject="Physics">Physics</div>
                <div class="subject-chip" data-subject="Chemistry">Chemistry</div>
                <div class="subject-chip" data-subject="Biology">Biology</div>
                <div class="subject-chip" data-subject="History">History</div>
                <div class="subject-chip" data-subject="Geography">Geography</div>
            </div>

            <div class="input-section">
                <label class="input-label">Your Question</label>
                <textarea class="question-input" id="questionInput" placeholder="Type your question here..."></textarea>
            </div>

            <div class="input-section">
                <label class="input-label">Or Upload Image</label>
                <div class="image-upload-area" id="uploadArea">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">Click to upload image</div>
                    <div class="upload-hint">Auto-compressed for ultra-fast answers</div>
                </div>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <button class="action-btn" id="submitBtn">Get Answer</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Getting answer in 2 seconds...</div>
        </div>

        <div class="error-card" id="errorCard">
            <div class="error-content">
                <div class="error-icon">⚠️</div>
                <div class="error-text" id="errorText"></div>
            </div>
        </div>

        <div class="card result-card" id="resultCard">
            <div class="result-header">
                <span>✅</span>
                <h3>Answer</h3>
            </div>
            <div class="answer-content" id="answerContent"></div>
        </div>
    </div>

    <script>
        const API_KEY = 'AQ.Ab8RN6J9YureVGpcjesrrCAUm_U8eLvpYqRLYwE4E9cIl4_Whg';
        let selectedSubject = 'Mathematics';
        let uploadedImage = null;

        // Subject selection
        document.querySelectorAll('.subject-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.subject-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                selectedSubject = this.dataset.subject;
            });
        });

        // Fast image compression
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');

        uploadArea.addEventListener('click', () => {
            if (!uploadArea.classList.contains('has-image')) {
                imageInput.click();
            }
        });

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);
                        uploadedImage = {
                            data: compressedBase64.split(',')[1],
                            mimeType: 'image/jpeg'
                        };
                        displayImagePreview(compressedBase64);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function displayImagePreview(src) {
            uploadArea.classList.add('has-image');
            uploadArea.innerHTML = `
                <div class="preview-container">
                    <img src="${src}" class="preview-image" alt="Uploaded">
                    <button class="remove-image" onclick="removeImage()">✕</button>
                </div>
            `;
        }

        window.removeImage = function() {
            uploadedImage = null;
            uploadArea.classList.remove('has-image');
            uploadArea.innerHTML = `
                <div class="upload-icon">📸</div>
                <div class="upload-text">Click to upload image</div>
                <div class="upload-hint">Auto-compressed for ultra-fast answers</div>
            `;
            imageInput.value = '';
        };

        // Submit handler
        document.getElementById('submitBtn').addEventListener('click', async function() {
            const question = document.getElementById('questionInput').value.trim();
            
            hideError();
            hideResult();

            if (!question && !uploadedImage) {
                showError('Please enter a question or upload an image');
                return;
            }

            showLoading();
            this.disabled = true;

            try {
                await fetchInstantAnswer(question, uploadedImage, selectedSubject);
            } catch (error) {
                hideLoading();
                showError(error.message);
            } finally {
                this.disabled = false;
            }
        });

        async function fetchInstantAnswer(question, image, subject) {
            // Direct Fast REST Endpoint (No SSE Stream Hang)
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${API_KEY}`;
            
            let prompt = `Subject: ${subject}.\n`;
            if (image && question) {
                prompt += `Question: ${question}\nSolve it using the image.\n`;
            } else if (image) {
                prompt += `Identify and solve the question in this image.\n`;
            } else {
                prompt += `Question: ${question}\n`;
            }

            prompt += `
CRITICAL INSTRUCTIONS:
1. LINE 1: Direct answer / correct option only (e.g. "Answer: 18").
2. Then give a very short 2-line explanation.
3. Plain text only. Do not use dollar signs ($) or LaTeX.`;

            const parts = [{ text: prompt }];
            
            if (image) {
                parts.push({
                    inline_data: {
                        mime_type: image.mimeType,
                        data: image.data
                    }
                });
            }

            // thinkingLevel LOW ensures instant processing without multi-minute deliberation
            const requestBody = {
                contents: [{ parts: parts }],
                generationConfig: {
                    maxOutputTokens: 250,
                    thinkingConfig: {
                        thinkingLevel: "LOW"
                    }
                }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error?.message || 'Failed to connect. Please try again.');
            }

            const data = await response.json();
            
            // Extract final text
            const partsList = data.candidates?.[0]?.content?.parts || [];
            let fullText = '';
            for (const p of partsList) {
                if (p.text && !p.thought) {
                    fullText += p.text;
                }
            }
            if (!fullText && partsList.length > 0) {
                fullText = partsList[partsList.length - 1].text || '';
            }

            fullText = fullText.replace(/\$/g, '').trim();

            if (!fullText) {
                throw new Error('No answer received. Please try again.');
            }

            // Turant spinner band aur answer card open
            hideLoading();
            const resultCard = document.getElementById('resultCard');
            const answerContent = document.getElementById('answerContent');
            resultCard.classList.add('show');
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            // Ultra-fast live typing effect (ChatGPT style)
            answerContent.textContent = '';
            let index = 0;
            return new Promise((resolve) => {
                const typingSpeed = 10; // milliseconds
                const interval = setInterval(() => {
                    const step = Math.min(3, fullText.length - index); // 3 letters ek baar me
                    answerContent.textContent += fullText.substr(index, step);
                    index += step;
                    if (index >= fullText.length) {
                        clearInterval(interval);
                        resolve();
                    }
                }, typingSpeed);
            });
        }

        function showLoading() {
            document.getElementById('loading').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }

        function showError(message) {
            const errorCard = document.getElementById('errorCard');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorCard.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorCard').classList.remove('show');
        }

        function hideResult() {
            document.getElementById('resultCard').classList.remove('show');
        }
    </script>
</body>
</html>
